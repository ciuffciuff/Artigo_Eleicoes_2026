<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eleição 2026 por município</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Plano: faixa verde com fio amarelo no topo (bandeira), conteúdo em grade de cartões brancos;
   azul = Lula, verde = Flávio, amarelo = alerta dos testes, cinza = demais. */
:root {
  color-scheme: light;
  --verde: #009c3b; --verde-esc: #00692a; --amarelo: #ffdf00; --azul: #002776; --azul-cand: #1f4fa0;
  --page: #f4f6f2; --surface: #ffffff; --ink: #0e1a12; --ink2: #4a5650; --muted: #7d877f;
  --grid: #e3e8e1; --axis: #c3cbc2; --ring: rgba(0,39,118,0.10); --wash: rgba(0,156,59,0.07);
  --c-lula: var(--azul-cand); --c-flavio: var(--verde); --c-outro: #a7ada6; --c-esp: #d8ddd6;
  --alerta-bg: #fff6b8; --alerta-borda: #e0c200; --amarelo-esc: #e0b800; --link: #00509e; --meio: #e9ece7;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0b120e; --surface: #141d17; --ink: #eef2ec; --ink2: #b9c3bb; --muted: #87918a;
    --grid: #26302a; --axis: #3a463e; --ring: rgba(255,255,255,0.09); --wash: rgba(0,200,80,0.08);
    --c-lula: #5b8ce6; --c-flavio: #22b85a; --c-outro: #6d756e; --c-esp: #3b443d;
    --alerta-bg: rgba(255,223,0,0.14); --alerta-borda: #b39b00; --link: #8fb8ff; --meio: #2a332d; --amarelo-esc: #c9a800;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark; --amarelo-esc: #c9a800;
  --page: #0b120e; --surface: #141d17; --ink: #eef2ec; --ink2: #b9c3bb; --muted: #87918a;
  --grid: #26302a; --axis: #3a463e; --ring: rgba(255,255,255,0.09); --wash: rgba(0,200,80,0.08);
  --c-lula: #5b8ce6; --c-flavio: #22b85a; --c-outro: #6d756e; --c-esp: #3b443d;
  --alerta-bg: rgba(255,223,0,0.14); --alerta-borda: #b39b00; --link: #8fb8ff; --meio: #2a332d;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--ink); font: 15px/1.45 var(--body); }
a { color: var(--link); cursor: pointer; text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--amarelo); outline-offset: 2px; }
.topo { background: var(--verde); color: #fff; border-bottom: 5px solid var(--amarelo); position: relative; }
.topo::after { content: ""; position: absolute; left: 0; right: 0; bottom: -9px; height: 4px; background: var(--azul); }
.topo .in { max-width: 1320px; margin: 0 auto; padding: 18px 20px 14px; display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: flex-end; justify-content: space-between; }
.topo h1 { font: 700 30px/1.05 var(--display); letter-spacing: .01em; margin: 0; text-wrap: balance; }
.topo .sub { font-size: 14px; opacity: .92; margin-top: 3px; }
.ctl { display: flex; gap: 10px; flex-wrap: wrap; }
.ctl label { font-size: 12px; display: flex; flex-direction: column; gap: 3px; opacity: .95; }
.ctl select, .ctl input { font: inherit; font-size: 14px; padding: 6px 9px; border-radius: 6px; border: 2px solid var(--amarelo);
  background: #fff; color: #0e1a12; min-width: 150px; }
.ctl input { min-width: 250px; }
.wrap { max-width: 1320px; margin: 0 auto; padding: 22px 20px 40px; }
.trilha { font: 600 20px/1.2 var(--display); margin: 2px 0 14px; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
.trilha .sep { color: var(--muted); }
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 10px; margin-bottom: 14px; }
.kpi { background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 10px 13px; border-top: 3px solid var(--verde); }
.kpi.az { border-top-color: var(--c-lula); } .kpi.vd { border-top-color: var(--c-flavio); } .kpi.am { border-top-color: var(--amarelo); }
.kpi .r { color: var(--ink2); font-size: 12.5px; }
.kpi .v { font: 700 28px/1.1 var(--display); }
.kpi .n { color: var(--muted); font-size: 12.5px; }
.grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 14px; }
@media (max-width: 440px) { .grade { grid-template-columns: 1fr; } .ctl input { min-width: 0; width: 100%; } }
.cartao { background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.cartao h2 { font: 700 19px/1.15 var(--display); margin: 0 0 3px; letter-spacing: .01em; }
.cartao .nota { color: var(--ink2); font-size: 13px; margin: 0 0 10px; }
.cheio { grid-column: 1 / -1; }
.hb { display: grid; grid-template-columns: minmax(150px, 44%) 1fr 78px; gap: 5px 10px; align-items: center; }
.hb .rot { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hb .rot small { color: var(--muted); }
.hb .tr { position: relative; height: 14px; }
.hb .bar { position: absolute; left: 0; top: 1px; height: 12px; border-radius: 0 4px 4px 0; }
.hb .ref { position: absolute; top: -3px; width: 2px; height: 20px; background: var(--ink); opacity: .6; border-radius: 1px; }
.hb .ref.r2 { opacity: .3; }
.hb .val { font-size: 14px; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.hb .val small { color: var(--muted); display: block; font-size: 11.5px; line-height: 1.1; }
.esp { height: 10px; }
.leg { display: flex; gap: 14px; flex-wrap: wrap; color: var(--ink2); font-size: 12.5px; margin-top: 10px; }
.leg i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.leg i.tk { width: 2px; height: 13px; background: var(--ink); opacity: .6; }
.leg i.tk2 { width: 2px; height: 13px; background: var(--ink); opacity: .3; }
.dl { display: grid; grid-template-columns: minmax(0, 55%) 1fr; gap: 4px 14px; font-size: 14px; margin: 0 0 12px; }
.dl dt { color: var(--ink2); } .dl dd { margin: 0; font-variant-numeric: tabular-nums; }
.dl dd small { color: var(--muted); }
.teste { display: grid; grid-template-columns: 50px 1fr auto; gap: 1px 10px; padding: 7px 4px; border-top: 1px solid var(--grid); }
.teste .cod { font: 700 15px var(--display); }
.teste .d { grid-column: 2 / 4; color: var(--ink2); font-size: 12.5px; }
.teste .q { text-align: right; font-variant-numeric: tabular-nums; }
.teste.zero { opacity: .5; }
.teste.on { background: var(--alerta-bg); border-radius: 6px; }
.selo { display: inline-block; padding: 0 7px; border-radius: 999px; font-size: 12.5px; background: var(--alerta-bg); border: 1px solid var(--alerta-borda); white-space: nowrap; }
.aviso { border-left: 4px solid var(--amarelo); background: var(--surface); padding: 8px 12px; border-radius: 0 8px 8px 0; font-size: 13.5px; color: var(--ink2); margin: 0 0 14px; }
.ferr { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 0 0 8px; }
.ferr input { font: inherit; padding: 5px 9px; border: 1px solid var(--axis); border-radius: 6px; background: var(--surface); color: var(--ink); min-width: 220px; }
.ferr button { font: inherit; font-size: 13px; padding: 5px 10px; border: 1px solid var(--axis); border-radius: 6px; background: var(--surface); color: var(--ink); cursor: pointer; }
.ferr button:hover { background: var(--wash); }
.ferr .conta { margin-left: auto; color: var(--ink2); font-size: 12.5px; }
.tabw { overflow: auto; max-height: 72vh; border: 1px solid var(--ring); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { padding: 5px 9px; border-bottom: 1px solid var(--grid); text-align: left; white-space: nowrap; }
th { position: sticky; top: 0; background: var(--surface); font-weight: 600; cursor: pointer; user-select: none; z-index: 1; box-shadow: inset 0 -2px 0 var(--verde); }
th.n, td.n { text-align: right; font-variant-numeric: tabular-nums; }
th .s { color: var(--muted); font-size: 11px; }
tbody tr { cursor: pointer; } tbody tr:hover { background: var(--wash); }
tbody tr.sel { background: var(--alerta-bg); box-shadow: inset 4px 0 0 var(--verde); }
.tabw { scrollbar-gutter: stable; }
.abrir { font-size: 12.5px; white-space: nowrap; }
td .pill { display: inline-block; width: 46px; height: 8px; border-radius: 4px; background: var(--c-flavio); position: relative; vertical-align: 1px; margin-right: 6px; overflow: hidden; }
td .pill b { position: absolute; left: 0; top: 0; bottom: 0; background: var(--c-lula); }
svg text { fill: var(--muted); font: 12px var(--body); }
svg .tile text { fill: #fff; font: 700 14px var(--display); }
svg .tile text.pv { font: 500 11px var(--body); }
svg .tile { cursor: pointer; }
svg .tile:hover rect, svg .tile:focus rect { stroke: var(--amarelo); stroke-width: 3; }
#tip { position: fixed; pointer-events: none; z-index: 20; background: var(--surface); color: var(--ink); border: 1px solid var(--ring);
  box-shadow: 0 6px 18px rgba(0,0,0,.18); border-radius: 8px; padding: 7px 10px; font-size: 13px; display: none; max-width: 320px; }
footer { max-width: 1320px; margin: 0 auto; padding: 0 20px 34px; color: var(--ink2); font-size: 12.5px; }
footer p { margin: 5px 0; max-width: 95ch; }

.abas { max-width: 1320px; margin: 0 auto; padding: 16px 20px 0; display: flex; gap: 6px; }
.abas a { font: 600 16px var(--display); letter-spacing: .02em; padding: 7px 14px; border-radius: 8px 8px 0 0; color: var(--ink2);
  border: 1px solid transparent; border-bottom: 3px solid transparent; }
.abas a:hover { text-decoration: none; background: var(--wash); }
.abas a.on { color: var(--ink); background: var(--surface); border-color: var(--ring); border-bottom-color: var(--verde); }
.metodo { margin-bottom: 14px; scroll-margin-top: 12px; }
.metodo .mhead { display: flex; gap: 14px; align-items: center; border-bottom: 1px solid var(--grid); padding-bottom: 10px; margin-bottom: 10px; }
.metodo .mcod { font: 700 22px var(--display); background: var(--verde); color: #fff; border-radius: 8px; padding: 6px 10px; min-width: 64px; text-align: center;
  box-shadow: inset 0 -4px 0 var(--amarelo); }
.metodo .mhead h2 { margin: 0; }
.metodo .fam { color: var(--ink2); font-size: 12.5px; text-transform: uppercase; letter-spacing: .06em; }
.metodo .mnum { margin-left: auto; text-align: right; font-size: 13px; color: var(--ink2); }
.metodo .mnum b { font: 700 24px var(--display); color: var(--ink); }
.metodo .perg { font-size: 16.5px; font-weight: 500; margin: 0 0 8px; max-width: 70ch; }
.metodo h3 { font: 700 15px var(--display); text-transform: uppercase; letter-spacing: .05em; color: var(--verde-esc); margin: 12px 0 3px; }
.metodo p { margin: 0 0 4px; max-width: 72ch; }
.mcols { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 10px 28px; }
@media (max-width: 860px) { .mcols { grid-template-columns: 1fr; } .metodo .mhead { flex-wrap: wrap; } .metodo .mnum { margin-left: 0; text-align: left; } }
.formula { font: 14px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; background: var(--page); border-left: 3px solid var(--azul-cand);
  padding: 7px 10px; border-radius: 0 6px 6px 0; margin: 8px 0; overflow-x: auto; }
.intro p { margin: 0 0 8px; max-width: 72ch; }
.indice { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.indice a { font: 600 14px var(--display); padding: 3px 10px; border: 1px solid var(--axis); border-radius: 999px; }
.indice a:hover { background: var(--wash); text-decoration: none; }
ol.bib { margin: 4px 0 0; padding-left: 22px; font-size: 13px; color: var(--ink2); }
ol.bib li { margin: 0 0 5px; max-width: 95ch; overflow-wrap: anywhere; }
ol.bib a { overflow-wrap: anywhere; }
ol.bib .usos a { display: inline-block; font: 600 12px var(--display); padding: 0 7px; border: 1px solid var(--axis); border-radius: 999px; margin-left: 3px; word-break: normal; }
#metodo-referencias { margin-top: 14px; scroll-margin-top: 12px; }
.crits { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.crit { background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 10px 12px; }
.crit h3 { font: 700 15px var(--display); margin: 0 0 2px; }
.crit .nota { margin: 2px 0 0; font-size: 12.5px; }
.ksel { display: inline-flex; gap: 6px; margin-left: 12px; vertical-align: middle; }
.ksel button { font: 600 14px var(--body); padding: 4px 12px; border-radius: 999px; border: 1px solid var(--axis); background: var(--surface); color: var(--ink); cursor: pointer; }
.ksel button.on { background: var(--verde); color: #fff; border-color: var(--verde); }
.gcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
.gcard { background: var(--surface); border: 1px solid var(--ring); border-top: 5px solid; border-radius: 10px; padding: 12px 14px; position: relative; }
.gcard h3 { font: 700 18px/1.15 var(--display); margin: 0 30px 4px 0; text-wrap: balance; }
.gcard .gnum { position: absolute; top: 10px; right: 12px; color: #fff; font: 700 14px var(--display); width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; }
.gcard .gk { color: var(--ink2); font-size: 13px; }
.traco { display: inline-block; padding: 0 6px; border: 1px solid var(--axis); border-radius: 999px; font-size: 12px; margin: 2px 2px 0 0; white-space: nowrap; }
table.heat td { text-align: center; font-size: 12px; font-variant-numeric: tabular-nums; padding: 5px 3px; min-width: 36px; cursor: default; }
table.heat th.hv { font-size: 11.5px; writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; padding: 6px 2px; box-shadow: none; cursor: default; }
table.heat th.hb2 { font-size: 11.5px; text-align: center; color: var(--ink2); border-left: 1px solid var(--grid); box-shadow: none; cursor: default; }
table.heat th.hg { white-space: nowrap; font-size: 13px; text-align: left; position: sticky; left: 0; background: var(--surface); cursor: default; }
table.heat th.hg i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
table.heat tbody tr { cursor: default; }
h2.secao { font: 700 24px var(--display); margin: 22px 0 2px; }
.teste .cod a { color: inherit; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="topo"><div class="in">
  <div><h1>Eleição presidencial 2026 por município</h1>
  <div class="sub">Votação nos dois turnos, perfil do eleitorado, Censo 2022 e testes forenses, do Brasil ao município</div></div>
  <div class="ctl">
    <label for="selUf">Estado<select id="selUf"></select></label>
    <label for="selMun">Município<input id="selMun" list="lista" placeholder="Escolha o estado" disabled autocomplete="off"><datalist id="lista"></datalist></label>
  </div>
</div></div>
<nav class="abas" aria-label="Seções do painel"><a id="abaPainel" data-ir="brasil">Painel</a><a id="abaMetodo" data-ir="metodologia">Metodologia dos testes</a><a id="abaClusters" data-ir="agrupamentos">Agrupamentos de municípios</a></nav>
<div class="wrap"><nav class="trilha" id="trilha" aria-label="Navegação"></nav><main id="main"></main></div>
<footer id="rodape"></footer>
<div id="tip"></div>
<script id="dados" type="application/json">__DADOS__</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("dados").textContent);
const NF = new Intl.NumberFormat("pt-BR");
const fmt = x => x == null || !isFinite(x) ? "–" : NF.format(Math.round(x));
const pct = (x, d = 1) => x == null || !isFinite(x) ? "–" : (100 * x).toLocaleString("pt-BR", {minimumFractionDigits: d, maximumFractionDigits: d}) + "%";
const pctA = x => pct(x, x != null && x < 0.01 ? 2 : 1);
const dec = (x, d = 2) => x == null || !isFinite(x) ? "–" : x.toLocaleString("pt-BR", {minimumFractionDigits: d, maximumFractionDigits: d});
const brl = x => x == null || !isFinite(x) ? "–" : "R$ " + NF.format(Math.round(x));
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const $ = id => document.getElementById(id);
const cap = s => String(s).toLowerCase().replace(/(^|[\s\-\/(.'])([a-zà-ú])/g, (m, a, b) => a + b.toUpperCase())
  .replace(/ (De|Da|Do|Das|Dos|E|Em|Ou)(?= )/g, w => w.toLowerCase());
const NOMES_UF = {AC:"Acre",AL:"Alagoas",AM:"Amazonas",AP:"Amapá",BA:"Bahia",CE:"Ceará",DF:"Distrito Federal",ES:"Espírito Santo",GO:"Goiás",
  MA:"Maranhão",MG:"Minas Gerais",MS:"Mato Grosso do Sul",MT:"Mato Grosso",PA:"Pará",PB:"Paraíba",PE:"Pernambuco",PI:"Piauí",PR:"Paraná",
  RJ:"Rio de Janeiro",RN:"Rio Grande do Norte",RO:"Rondônia",RR:"Roraima",RS:"Rio Grande do Sul",SC:"Santa Catarina",SE:"Sergipe",SP:"São Paulo",TO:"Tocantins"};
const UFS = Object.keys(D.ufs).sort();
const C1 = D.cand["1"], C2 = D.cand["2"];
const iC = (C, n) => C.findIndex(c => c.num === n);
const L1 = iC(C1, 13), F1 = iC(C1, 22), L2 = iC(C2, 13), F2 = iC(C2, 22);
const corCand = n => n === 13 ? "var(--c-lula)" : n === 22 ? "var(--c-flavio)" : "var(--c-outro)";
const PER = [["fem","Mulheres"],["i1624","16 a 24 anos"],["i60","60 anos ou mais"],["sup","Ensino superior"],["baixa","Até fundamental incompleto"],
  ["bio","Com biometria"],["rinf","Informou cor ou raça"],["rpp","Preta ou parda (de quem informou)"]];
const CEN = [["pp","Preta ou parda"],["ind","Indígena"],["analf","Analfabetismo (15 anos ou mais)"],["esg","Esgoto por rede geral"]];

// ---- agregação de um conjunto de municípios -----------------------------------
function agregar(U, ids) {
  const a = {mun: ids.length, sec: 0, loc: 0, apt: 0, cmp1: 0, cmp2: 0, v1: C1.map(() => 0), v2: C2.map(() => 0),
    p: {}, c: {}, terr: D.territorios.map(() => 0), fl: D.testes.map(() => 0), qual: 0, pop: 0, pop15: 0, aptPop: 0};
  const ps = {}, cs = {}; let wp = 0, wr = 0, wc = 0, rp = 0;
  PER.forEach(([k]) => ps[k] = 0); CEN.forEach(([k]) => cs[k] = 0); cs.renda = 0;
  for (const m of ids) {
    a.sec += U.sec[m]; a.loc += U.loc[m]; a.apt += U.apt[m]; a.cmp1 += U.cmp1[m]; a.cmp2 += U.cmp2[m];
    U.v1.forEach((col, k) => a.v1[k] += col[m]); U.v2.forEach((col, k) => a.v2[k] += col[m]);
    if (U.wp[m]) { wp += U.wp[m]; for (const k in U.p) ps[k] += (U.p[k][m] || 0) * U.wp[m]; }
    if (U.wr[m] && U.rpp[m] != null) { wr += U.wr[m]; rp += U.rpp[m] * U.wr[m]; }
    if (U.wc[m]) { wc += U.wc[m]; for (const k in U.c) cs[k] += (U.c[k][m] || 0) * U.wc[m]; }
    U.terr.forEach((col, k) => a.terr[k] += col[m]); U.fl.forEach((col, k) => a.fl[k] += col[m]); a.qual += U.qual[m];
    if (U.pop[m] != null) { a.pop += U.pop[m]; a.pop15 += U.pop15[m]; a.aptPop += U.apt[m]; }
  }
  for (const k in U.p) a.p[k] = wp ? ps[k] / wp : null;
  a.p.rpp = wr ? rp / wr : null;
  for (const k in cs) a.c[k] = wc ? cs[k] / wc : null;
  return a;
}
const todos = U => U.cod.map((_, m) => m);
const AG = {};
UFS.forEach(u => AG[u] = agregar(D.ufs[u], todos(D.ufs[u])));
const BR = (() => {   // Brasil = soma das UFs, médias ponderadas
  const a = {mun: 0, sec: 0, loc: 0, apt: 0, cmp1: 0, cmp2: 0, v1: C1.map(() => 0), v2: C2.map(() => 0), p: {}, c: {},
    terr: D.territorios.map(() => 0), fl: D.testes.map(() => 0), qual: 0, pop: 0, pop15: 0, aptPop: 0};
  const wsum = {}, vsum = {};
  for (const u of UFS) { const x = AG[u], U = D.ufs[u];
    for (const k of ["mun","sec","loc","apt","cmp1","cmp2","qual","pop","pop15","aptPop"]) a[k] += x[k];
    x.v1.forEach((v, k) => a.v1[k] += v); x.v2.forEach((v, k) => a.v2[k] += v);
    x.terr.forEach((v, k) => a.terr[k] += v); x.fl.forEach((v, k) => a.fl[k] += v);
    const wp = U.wp.reduce((s, v) => s + v, 0), wr = U.wr.reduce((s, v) => s + v, 0), wc = U.wc.reduce((s, v) => s + v, 0);

function linhasMunTeste(b) {
  const out = [];
  for (const u of UFS) { const U = D.ufs[u];
    U.cod.forEach((c, m) => { const n = b == null ? (U.n12[m] != null ? 1 : 0) : U.fl[b][m];
      if (n) out.push({u, m, nome: cap(U.nome[m]), n, sec: U.sec[m], l2: sh(C2, U.v2.map(col => col[m]), L2), dip: U.n12[m]}); }); }
  return out;
}

function grafCriterio(chave, titulo, nota, melhor, opc = {}) {
  const C = CL.criterios, ks = C.map(r => r.k), ys = C.map(r => r[chave]);
  const W = 300, H = 170, ml = 46, mr = 10, mt = 12, mb = 28, w = W - ml - mr, h = H - mt - mb;
  let lo = Math.min(...ys), hi = Math.max(...ys);
  if (opc.se) { lo = Math.min(...C.map(r => r[chave] - r[opc.se])); hi = Math.max(...C.map(r => r[chave] + r[opc.se])); }
  const pad = (hi - lo) * 0.12 || 1; lo -= pad; hi += pad;
  const x = k => ml + w * (k - ks[0]) / (ks[ks.length - 1] - ks[0]), y = v => mt + h - h * (v - lo) / (hi - lo);
  const f = opc.fmt || (v => dec(v, 3));
  let s = "";
  for (let j = 0; j <= 3; j++) { const v = lo + (hi - lo) * j / 3; s += `<line x1="${ml}" x2="${W - mr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${ml - 5}" y="${y(v) + 4}" text-anchor="end">${f(v)}</text>`; }
  ks.forEach(k => s += `<text x="${x(k)}" y="${H - 9}" text-anchor="middle">${k}</text>`);
  const kr = +K_SEL;
  s += `<line x1="${x(kr)}" x2="${x(kr)}" y1="${mt}" y2="${mt + h}" stroke="var(--amarelo-esc)" stroke-width="2" stroke-dasharray="4 3"/>`;
  if (opc.se) C.forEach(r => s += `<line x1="${x(r.k)}" x2="${x(r.k)}" y1="${y(r[chave] - r[opc.se])}" y2="${y(r[chave] + r[opc.se])}" stroke="var(--c-outro)" stroke-width="2"/>`);
  s += `<polyline fill="none" stroke="var(--verde)" stroke-width="2" points="${C.map(r => x(r.k) + "," + y(r[chave])).join(" ")}"/>`;
  C.forEach(r => { const best = r.k === melhor;
    s += `<g data-tip="k = ${r.k}<br>${esc(titulo)}: <b>${f(r[chave])}</b>${best ? "<br>indicação deste critério" : ""}">
      <circle cx="${x(r.k)}" cy="${y(r[chave])}" r="12" fill="transparent"/>
      <circle cx="${x(r.k)}" cy="${y(r[chave])}" r="${best ? 6 : 4}" fill="${best ? "var(--azul)" : "var(--verde)"}" stroke="var(--surface)" stroke-width="2"/></g>`; });
  return `<div class="crit"><h3>${titulo}</h3><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(titulo)}">${s}</svg>
    <p class="nota">${nota} <b>Indica k = ${melhor}.</b></p></div>`;
}

function dendrograma(k) {
  const T = CL.dendro, F = CL.finais[k].dendro_folhas, n = T.tam_sub.length;
  // ordem das folhas pela travessia da árvore
  const filhos = j => T.topo[j - 1];   // fusão j (1..29): [a, b]; negativo = folha
  const ordem = []; (function vis(x) { if (x < 0) ordem.push(-x); else filhos(x).forEach(vis); })(T.topo.length);
  const W = 900, H = 300, ml = 46, mr = 10, mt = 14, mb = 64, w = W - ml - mr, h = H - mt - mb;
  const hmax = Math.max(...T.topo_altura) * 1.03, hmin = 0;
  const xF = {}; ordem.forEach((f, i) => xF[f] = ml + w * (i + 0.5) / n);
  const y = v => mt + h - h * (v - hmin) / (hmax - hmin);
  const pos = {}; let s = "";
  [0, 50, 100, 150, 200, 250].filter(v => v < hmax).forEach(v => s += `<line x1="${ml}" x2="${W - mr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${ml - 5}" y="${y(v) + 4}" text-anchor="end">${v}</text>`);
  const grupoFolha = f => (F.find(r => r.folha === f) || {}).grupo_km;
  const p = x => x < 0 ? {x: xF[-x], y: y(0), g: grupoFolha(-x)} : pos[x];
  T.topo.forEach((par, j) => { const a = p(par[0]), b = p(par[1]), yy = y(T.topo_altura[j]);
    const g = a.g === b.g ? a.g : null, cor = g ? corG(g) : "var(--ink2)";
    s += `<path d="M${a.x},${a.y}V${yy}H${b.x}V${b.y}" fill="none" stroke="${cor}" stroke-width="${g ? 2.2 : 1.6}"/>`;
    pos[j + 1] = {x: (a.x + b.x) / 2, y: yy, g}; });
  ordem.forEach(f => { const g = grupoFolha(f), nn = T.tam_sub[f - 1];
    s += `<g data-tip="Subgrupo de Ward com <b>${fmt(nn)}</b> municípios<br>maioria no grupo K-means: ${esc(nomeG(k, g))}">
      <rect x="${xF[f] - w / n / 2 + 1}" y="${y(0) + 4}" width="${w / n - 2}" height="${Math.max(4, 40 * Math.sqrt(nn / 1200))}" rx="2" fill="${corG(g)}"/></g>`; });
  // linha de corte em k grupos
  const alt = CL.dendro.alturas, corte = (alt[k - 2] + alt[k - 1]) / 2;
  s += `<line x1="${ml}" x2="${W - mr}" y1="${y(corte)}" y2="${y(corte)}" stroke="var(--amarelo-esc)" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="${W - mr}" y="${y(corte) - 6}" text-anchor="end" style="fill:var(--ink2)">corte em ${k} grupos</text>`;
  s += `<text x="${ml - 34}" y="${mt + h / 2}" transform="rotate(-90 ${ml - 34} ${mt + h / 2})" text-anchor="middle">altura (Ward)</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Dendrograma de Ward">${s}</svg>`;
}

function heatCentros(k) {

    `<td style="background:${cor(z)};color:${Math.abs(z) > 1.1 ? "#fff" : "var(--ink)"}" data-tip="<b>${esc(nomeG(k, g + 1))}</b><br>${esc(NOMES_VAR[V[j]])}<br>média padronizada: ${dec(z)}">${dec(z, 1)}</td>`).join("")}</tr>`).join("");
  return `<div class="tabw" style="max-height:none"><table class="heat"><thead><tr><th></th>${sub}</tr><tr><th></th>${cab}</tr></thead><tbody>${linhas}</tbody></table></div>
    <div class="leg"><span>Abaixo da média do país</span><span style="display:inline-flex">${[-2, -1.3, -0.6, 0, 0.6, 1.3, 2].map(z => `<i style="background:${cor(z)};width:20px;margin:0;border-radius:0"></i>`).join("")}</span><span>Acima da média</span>
    <span style="color:var(--muted)">Valores em desvios-padrão (z) em relação à média dos 5.571 municípios.</span></div>`;
}

function dispersao(k) {
  const fin = CL.finais[k], W = 900, H = 460, ml = 40, mr = 14, mt = 12, mb = 36, w = W - ml - mr, h = H - mt - mb;
  const xs = fin.mun.map(r => r.pc1), ys = fin.mun.map(r => r.pc2);
  const q = (a, p) => { const s = a.slice().sort((x, y) => x - y); return s[Math.floor(p * (s.length - 1))]; };
  const x0 = q(xs, 0.002), x1 = q(xs, 0.998), y0 = q(ys, 0.002), y1 = q(ys, 0.998);
  const px = v => ml + w * (Math.min(Math.max(v, x0), x1) - x0) / (x1 - x0), py = v => mt + h - h * (Math.min(Math.max(v, y0), y1) - y0) / (y1 - y0);
  let s = `<rect x="${ml}" y="${mt}" width="${w}" height="${h}" fill="none" stroke="var(--grid)"/>`;
  const tam = g => fin.perfil[g - 1].municipios;   // grupos grandes primeiro, os pequenos por cima
  const ordem = fin.mun.map((r, i) => i).sort((a, b) => tam(fin.mun[b].grupo) - tam(fin.mun[a].grupo));
  for (const i of ordem) { const r = fin.mun[i], U = D.ufs[r.uf], m = U.cod.indexOf(r.cod);
    s += `<circle class="pt g${r.grupo}" cx="${px(r.pc1).toFixed(1)}" cy="${py(r.pc2).toFixed(1)}" r="3.2" fill="${corG(r.grupo)}" fill-opacity=".7" stroke="var(--surface)" stroke-width=".6"
      data-ir="mun-${r.uf.toLowerCase()}-${r.cod}" data-tip="<b>${esc(cap(U.nome[m]))}</b> (${r.uf})<br>${esc(nomeG(k, r.grupo))}<br>silhueta ${dec(r.silh)}"/>`; }
  // setas das variáveis mais importantes nos dois eixos
  const rot = fin.pca_rot, V = CL.vars, top = V.map((v, j) => [v, rot[j][0], rot[j][1]]).sort((a, b) => (b[1] ** 2 + b[2] ** 2) - (a[1] ** 2 + a[2] ** 2)).slice(0, 7);
  const cx = px(0), cy = py(0), esc_ = Math.min(w, h) * 0.9;
  const rotulos = [];
  top.forEach(([v, a, b]) => { const ex = cx + a * esc_, ey = cy - b * esc_;
    let ly = ey + (b >= 0 ? -6 : 14);
    while (rotulos.some(r => Math.abs(r.x - ex) < 70 && Math.abs(r.y - ly) < 14)) ly += b >= 0 ? -14 : 14;   // evita sobreposição
    rotulos.push({x: ex, y: ly});
    s += `<line x1="${cx}" y1="${cy}" x2="${ex}" y2="${ey}" stroke="var(--ink)" stroke-width="1.6" opacity=".75"/>
      <text x="${ex + (a >= 0 ? 4 : -4)}" y="${ly}" text-anchor="${a >= 0 ? "start" : "end"}" style="fill:var(--ink);font-weight:600;paint-order:stroke;stroke:var(--surface);stroke-width:3px">${esc(CURTO_VAR[v])}</text>`; });
  s += `<text x="${ml + w / 2}" y="${H - 6}" text-anchor="middle">Componente principal 1 (${pct(fin.pca_var[0], 0)} da variância)</text>
    <text x="14" y="${mt + h / 2}" transform="rotate(-90 14 ${mt + h / 2})" text-anchor="middle">Componente 2 (${pct(fin.pca_var[1], 0)})</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Municípios nos dois primeiros componentes principais" id="svgDisp">${s}</svg>`;
}

function legendaGrupos(k, interativa) {
  const fin = CL.finais[k];
  return `<div class="leg" style="gap:8px 16px">${fin.perfil.map(p => `<span ${interativa ? `class="legG" data-grupo="${p.grupo}" style="cursor:pointer"` : ""}><i style="background:${corG(p.grupo)}"></i>${esc(nomeG(k, p.grupo))} <small style="color:var(--muted)">(${fmt(p.municipios)})</small></span>`).join("")}
    ${interativa ? '<span style="color:var(--muted)">Clique num grupo para destacá-lo; clique num ponto para abrir o município.</span>' : ""}</div>`;
}

function cartoesGrupos(k) {
  const fin = CL.finais[k], V = CL.vars, tot = fin.perfil.reduce((s, p) => s + p.secoes, 0), sinT = fin.perfil.reduce((s, p) => s + p.sinalizadas, 0);
  return `<div class="gcards">${fin.perfil.map(p => { const g = p.grupo, cz = fin.centros_z[g - 1];
    const traços = V.map((v, j) => [v, cz[j]]).sort((a, b) => Math.abs(b[1]) - Math.abs(a[1])).slice(0, 5);
    return `<article class="gcard" style="border-top-color:${corG(g)}"><div class="gnum" style="background:${corG(g)}">${g}</div>
      <h3>${esc(nomeG(k, g))}</h3>
      <div class="gk"><b>${fmt(p.municipios)}</b> municípios · ${fmt(p.secoes)} seções · ${pct(p.secoes / tot)} das seções</div>
      <dl class="dl" style="margin:8px 0">
        <dt>Lula no 2º turno (mediana)</dt><dd>${pct(p.lula2)}</dd>
        <dt>Renda do responsável (mediana)</dt><dd>${brl(p.renda)}</dd>
        <dt>Até fundamental incompleto</dt><dd>${pct(p.esc_baixa)}</dd>
        <dt>Seções em setor rural</dt><dd>${pct(p.rural)}</dd>
        <dt>Eleitores por município (mediana)</dt><dd>${fmt(p.aptos_mediana)}</dd>
        <dt>Seções marcadas em algum teste</dt><dd><b>${pct(p.sinalizadas / p.secoes, 2)}</b> <small>(${fmt(p.sinalizadas)}; país ${pct(sinT / tot, 2)})</small></dd>
        <dt>Silhueta média</dt><dd>${dec(p.silh)}</dd></dl>
      <div class="nota" style="margin:0">Mais distante da média do país em: ${traços.map(([v, z]) => `<span class="traco">${esc(CURTO_VAR[v])} ${z > 0 ? "▲" : "▼"}${dec(Math.abs(z), 1)}</span>`).join(" ")}</div>
    </article>`; }).join("")}</div>`;
}

function testesPorGrupo(k) {
  const fin = CL.finais[k], T = D.testes;
  const taxa = (g, b) => fin.testes_grupo[g - 1][b] / fin.perfil[g - 1].secoes;
  const totS = fin.perfil.reduce((s, p) => s + p.secoes, 0);
  const mx = Math.max(...fin.perfil.flatMap(p => T.map((t, b) => taxa(p.grupo, b))));
  const cel = (g, b) => { const r = taxa(g, b), base = T.length ? fin.testes_grupo.reduce((s, row) => s + row[b], 0) / totS : 0, raz = base ? r / base : 0;
    return `<td class="n" style="background:rgba(224,184,0,${Math.min(0.85, 0.85 * Math.sqrt(r / mx))})" data-tip="<b>${esc(nomeG(k, g))}</b> · ${T[b].cod}<br>${fmt(fin.testes_grupo[g - 1][b])} seções (${pct(r, 3)})<br>${dec(raz, 1)} vezes a taxa do país">${r ? pct(r, 2) : "–"}</td>`; };
  return `<div class="tabw" style="max-height:none"><table><thead><tr><th>Grupo</th>${T.map(t => `<th class="n"><a data-ir="metodo-${t.cod.toLowerCase()}" style="color:inherit" title="${esc(t.nome)}">${t.cod}</a></th>`).join("")}<th class="n">Algum</th></tr></thead>
    <tbody>${fin.perfil.map(p => `<tr><td><i style="display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;background:${corG(p.grupo)}"></i>${esc(nomeG(k, p.grupo))}</td>${T.map((t, b) => cel(p.grupo, b)).join("")}<td class="n"><b>${pct(p.sinalizadas / p.secoes, 2)}</b></td></tr>`).join("")}</tbody></table></div>
    <p class="nota" style="margin-top:6px">% das seções do grupo marcadas em cada teste. Os testes não entraram no agrupamento: a tabela mostra onde as marcações se concentram.</p>`;
}

function ufsPorGrupo(k) {
  const fin = CL.finais[k], cont = {}; UFS.forEach(u => cont[u] = new Array(fin.perfil.length).fill(0));
  fin.mun.forEach(r => cont[r.uf][r.grupo - 1]++);
  const W = 900, rowH = 17, ml = 150, mr = 10, H = UFS.length * rowH + 10, w = W - ml - mr;
  let s = "";
  UFS.forEach((u, i) => { const tot = cont[u].reduce((a, b) => a + b, 0); let x = ml; const y = 4 + i * rowH;
    s += `<text x="${ml - 6}" y="${y + 11}" text-anchor="end" style="fill:var(--ink2)">${esc(NOMES_UF[u])}</text>`;
    cont[u].forEach((c, g) => { if (!c) return; const ww = w * c / tot;
      s += `<rect x="${x}" y="${y}" width="${Math.max(ww - 1.5, 0.5)}" height="${rowH - 4}" fill="${corG(g + 1)}" data-tip="<b>${esc(NOMES_UF[u])}</b><br>${esc(nomeG(k, g + 1))}: ${c} de ${tot} municípios (${pct(c / tot)})"/>`; x += ww; }); });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Composição dos estados por grupo">${s}</svg>`;
}

function telaClusters() {
  trilha([["Brasil", "brasil"], ["Agrupamentos de municípios"]]);
  $("selUf").value = ""; $("selMun").value = ""; $("selMun").disabled = true;
  const C = CL.criterios, ind = CL.indicacao, k = K_SEL, fin = CL.finais[k];
  const kRec = CL.k_recomendado;
  const votos = Object.entries(ind), nomesCrit = {cotovelo: "Cotovelo", silhueta: "Silhueta", calinski: "Calinski-Harabasz", davies: "Davies-Bouldin",
    gap_tibs: "Gap (Tibshirani)", gap_primeiro: "Gap (primeiro máximo)", ward_salto: "Maior salto no dendrograma", estabilidade: "Estabilidade"};
  const contaVotos = {}; votos.forEach(([c, kk]) => contaVotos[kk] = (contaVotos[kk] || 0) + 1);
  const linhasMun = fin.mun.map(r => { const U = D.ufs[r.uf], m = U.cod.indexOf(r.cod), a = agregar(U, [m]);
    return {u: r.uf, m, nome: cap(U.nome[m]), g: r.grupo, silh: r.silh, l2: lula2(a), renda: a.c.renda, sec: a.sec, sin: a.qual, apt: a.apt}; });
  const colsMun = [{t: "Município", v: r => r.nome}, {t: "UF", v: r => r.u},
    {t: "Grupo", v: r => r.g, h: r => `<i style="display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;background:${corG(r.g)}"></i>${esc(nomeG(k, r.g))}`},
    {t: "Silhueta", v: r => r.silh, n: 1, f: x => dec(x), dica: "Quanto o município se parece com o próprio grupo (perto de 1) ou com outro grupo (negativo)"},
    {t: "Aptos", v: r => r.apt, n: 1, f: fmt}, {t: "Lula × Flávio 2º", v: r => r.l2, n: 1, h: r => barra2(r.l2)},
    {t: "Renda (Censo)", v: r => r.renda, n: 1, f: brl}, {t: "Seções", v: r => r.sec, n: 1, f: fmt},
    {t: "% marcadas", v: r => r.sin / r.sec, n: 1, f: x => pct(x, 2)}, colAbrir];
  const irM = r => `mun-${r.u.toLowerCase()}-${D.ufs[r.u].cod[r.m]}`;
  $("main").innerHTML = `
  <section class="cartao intro"><h2>Agrupamento dos municípios por K-means</h2><div class="mcols"><div>
    <p>O K-means divide os ${fmt(CL.n)} municípios em k grupos de modo que cada município fique no grupo cujo centro (a média do grupo) esteja mais perto dele.
    A distância é calculada sobre ${CL.vars.length} variáveis em quatro blocos: <b>votação</b> (Lula e Flávio nos dois turnos, demais candidatos, brancos e nulos, abstenção),
    <b>perfil do eleitorado</b> (sexo, idade, escolaridade, biometria), <b>Censo 2022</b> em volta dos locais de votação (renda, cor ou raça, população indígena, analfabetismo, esgoto)
    e <b>território</b> (seções em setor rural, favela, quilombo e terra indígena), mais o porte do município.</p>
    <p><b>Preparação.</b> Renda e porte entram em logaritmo; as proporções muito concentradas (indígena, favela, quilombo) entram pela raiz quadrada, para que poucos municípios
    extremos não dominem a distância. Todas as variáveis foram padronizadas (média 0 e desvio 1), para pesar igual. Seis municípios sem ligação com o Censo receberam a mediana do estado.</p>
  </div><div>
    <p><b>Os testes forenses ficaram de fora</b> do agrupamento, de propósito: os grupos descrevem o perfil dos municípios, e depois se compara em quais grupos as seções marcadas se concentram.</p>
    <p><b>Execução.</b> Para cada k, o K-means foi rodado com 50 inícios aleatórios (200 no modelo final), guardando a melhor solução. Script: <code>16_clusters_municipios.R</code>, em R
    (pacotes <code>stats</code>, <code>cluster</code> e <code>data.table</code>).</p>
  </div></div></section>

  <h2 class="secao">1. Escolha do número de grupos</h2>
  <p class="nota">Antes de rodar o modelo final, k foi comparado de 2 a 10 por oito critérios. O ponto azul é a indicação de cada critério; a linha amarela, o k em exibição.</p>
  <div class="crits">
    ${grafCriterio("wss", "Cotovelo (soma de quadrados dentro dos grupos)", "Quanto menor, mais compactos os grupos; procura-se o ponto em que a queda perde força (maior distância à reta entre k = 1 e k = 10).", ind.cotovelo, {fmt: v => fmt(v)})}
    ${grafCriterio("silhueta", "Silhueta média", "Compara a distância de cada município ao próprio grupo com a distância ao grupo vizinho; vai de −1 a 1, maior é melhor.", ind.silhueta)}
    ${grafCriterio("calinski", "Calinski-Harabasz", "Razão entre a dispersão entre grupos e dentro dos grupos, corrigida por k; maior é melhor. Tende a favorecer k pequeno quando não há grupos nítidos.", ind.calinski, {fmt: v => fmt(v)})}
    ${grafCriterio("davies", "Davies-Bouldin", "Média, para cada grupo, da maior semelhança com outro grupo (espalhamento sobre distância entre centros); menor é melhor.", ind.davies)}
    ${grafCriterio("gap", "Estatística gap (± erro-padrão)", "Compara a compactação real com a de dados sem estrutura (50 simulações uniformes); escolhe o menor k a até um erro-padrão do seguinte.", ind.gap_tibs, {se: "gap_se"})}
    ${grafCriterio("estabilidade", "Estabilidade (índice de Rand ajustado)", "Concordância entre o agrupamento completo e 30 reagrupamentos em subamostras de 80%; perto de 1 é estável.", ind.estabilidade)}
    ${grafCriterio("ward_salto", "Salto no dendrograma de Ward", "Quanto a altura da árvore cai na fusão que cria k grupos; um salto grande indica separação nítida.", ind.ward_salto, {fmt: v => dec(v, 0)})}
    ${grafCriterio("ari_ward", "Concordância K-means × Ward", "Índice de Rand ajustado entre o K-means e o corte do dendrograma de Ward no mesmo k; mostra se dois métodos diferentes acham os mesmos grupos.", C.reduce((b, r) => r.ari_ward > b.ari_ward ? r : b).k)}
  </div>
  <div class="grade" style="margin-top:14px">
  <section class="cartao"><h2>Quadro dos critérios</h2>
    <div class="tabw" style="max-height:none"><table><thead><tr><th>Critério</th><th class="n">k indicado</th></tr></thead><tbody>
    ${votos.map(([c, kk]) => `<tr style="cursor:default"><td>${nomesCrit[c] || c}</td><td class="n"><b>${kk}</b></td></tr>`).join("")}</tbody></table></div>
    <p class="nota" style="margin-top:8px">Votos: ${Object.entries(contaVotos).sort((a, b) => b[1] - a[1]).map(([kk, n]) => `k = ${kk}: ${n}`).join(" · ")}.</p></section>
  <section class="cartao"><h2>Decisão</h2>${CL.decisao}</section></div>

  <section class="cartao" style="margin-top:14px"><h2>Dendrograma de Ward</h2>
    <p class="nota">Agrupamento hierárquico das mesmas variáveis padronizadas (método de Ward). Para caber na tela, a árvore mostra só as 29 fusões do topo:
    cada barra na base é um subgrupo de municípios (a altura da barra cresce com o tamanho), colorido pelo grupo K-means em que está a maioria deles.
    Ramos de uma cor só indicam que Ward e K-means concordam.</p>${dendrograma(k)}${legendaGrupos(k)}</section>

  <h2 class="secao">2. Os grupos <span class="ksel">${Object.keys(CL.finais).map(kk => `<button data-kcl="${kk}" class="${kk === k ? "on" : ""}">k = ${kk}${+kk === kRec ? " (recomendado)" : " (detalhado)"}</button>`).join("")}</span></h2>
  <p class="nota">Grupos numerados do menor para o maior % de Lula no 2º turno (mediana). ${fmt(CL.n)} municípios; ${pct(1 - C.find(r => r.k === +k).wss / (C[0].wss / (1 - C[0].pct_explicado)), 0)} da variância está entre os grupos;
    silhueta média ${dec(C.find(r => r.k === +k).silhueta)}; concordância com Ward ${dec(fin.ari_ward)}.</p>
  ${cartoesGrupos(k)}
  <section class="cartao" style="margin-top:14px"><h2>Perfil médio de cada grupo</h2><p class="nota">Centro de cada grupo nas variáveis padronizadas: verde acima da média do país, azul abaixo. Passe o mouse para ver o valor.</p>${heatCentros(k)}</section>
  <section class="cartao" style="margin-top:14px"><h2>Mapa dos municípios nos dois componentes principais</h2>
    <p class="nota">Cada ponto é um município, projetado nos dois eixos que mais resumem as ${CL.vars.length} variáveis (análise de componentes principais).
    As setas mostram as variáveis que mais pesam nesses eixos. Pontos extremos foram encostados na borda.</p>${dispersao(k)}${legendaGrupos(k, true)}</section>
  <section class="cartao" style="margin-top:14px"><h2>Testes forenses por grupo</h2>${testesPorGrupo(k)}</section>
  <section class="cartao" style="margin-top:14px"><h2>Composição dos estados</h2><p class="nota">Parte dos municípios de cada estado em cada grupo.</p>${ufsPorGrupo(k)}${legendaGrupos(k)}</section>
  <section class="cartao" style="margin-top:14px"><h2>Municípios e seus grupos</h2>
    <p class="nota">Busque pelo nome, pela sigla do estado ou pelo nome do grupo. Clique numa linha para abrir o município.</p>
    <div class="ferr" style="margin-bottom:6px">${fin.perfil.map(p => `<button data-fg="${p.grupo}"><i style="display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;background:${corG(p.grupo)}"></i>${esc(nomeG(k, p.grupo))}</button>`).join("")}<button data-fg="0">Todos</button></div>
    ${tabela("clmun", colsMun, linhasMun, 2, irM, {lim: 1e9, altura: 460})}</section>`;
  desenha("clmun");
}
document.addEventListener("click", ev => {
  const kb = ev.target.closest("[data-kcl]"); if (kb) { K_SEL = kb.dataset.kcl; const y = scrollY; telaClusters(); scrollTo(0, y); return; }
  const fg = ev.target.closest("[data-fg]"); if (fg) { const T = TAB.clmun, g = +fg.dataset.fg; T.filtro = g ? (r => r.g === g) : null; T.rotFiltro = g ? nomeG(K_SEL, g) : ""; desenha("clmun"); return; }
  const lg = ev.target.closest(".legG"); if (lg) { const svg = $("svgDisp"), g = lg.dataset.grupo, on = svg.dataset.g === g;
    svg.dataset.g = on ? "" : g; svg.querySelectorAll(".pt").forEach(p => p.setAttribute("fill-opacity", on || p.classList.contains("g" + g) ? ".7" : ".06"));
    document.querySelectorAll(".legG").forEach(e => e.style.opacity = on || e.dataset.grupo === g ? "1" : ".45"); }
});
// grupo do município (usado na página do município)
function grupoMunHtml(uf, cod) {
  const r = munGrupo[uf + "-" + cod]; if (!r) return "";
  return `<div class="aviso" style="border-left-color:var(--azul-cand)">Agrupamento: ${Object.keys(r).sort((a, b) => a - b).map(k => `<b>k = ${k}</b>: <span style="white-space:nowrap"><i style="display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px;background:${corG(r[k].grupo)}"></i>${esc(nomeG(k, r[k].grupo))}</span> (silhueta ${dec(r[k].silh)})`).join(" · ")}.
    <a data-ir="agrupamentos">Ver os grupos</a></div>`;
}

ATUAL = location.hash.slice(1) || "brasil";
render();
</script>
