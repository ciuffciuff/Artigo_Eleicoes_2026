name: Painel - votos de todos os candidatos

# Roda scripts/15_painel_candidatos.R numa máquina do GitHub e grava o
# resultado no branch painel-dados, junto com o painel (painel/index.html).
# Não apaga o que o 14_painel_dados.R já gravou lá (resumo.json, uf_XX.json).
#
# Para rodar: aba Actions > "Painel - votos de todos os candidatos" > Run workflow.
# Num push que mude o script 15, o painel ou este arquivo, roda sozinho.
on:
  workflow_dispatch:
  push:
    branches: [ibge-actions, painel-html]
    paths: ["scripts/15_painel_candidatos.R", "painel/index.html", ".github/workflows/painel_candidatos.yml"]

jobs:
  painel:
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # para gravar no branch painel-dados
    timeout-minutes: 120
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      # dados que o 14 já gravou (o 15 usa a tabela de população do N15 que está lá)
      - name: Branch painel-dados em painel/dados
        uses: actions/checkout@v4
        with:
          ref: painel-dados
          path: painel/dados

      # se o script 15 não mudou desde a última rodada, só atualiza o index.html
      - name: Precisa rodar o R?
        run: |
          novo=$(sha1sum scripts/15_painel_candidatos.R scripts/00_config.R | sha1sum | cut -c1-12)
          antigo=$(cat painel/dados/.versao_15 2>/dev/null || echo nenhum)
          echo "VERSAO_15=$novo" >> $GITHUB_ENV
          if [ "$novo" = "$antigo" ] && [ -f painel/dados/candidatos.json ]; then echo "RODAR_R=nao" >> $GITHUB_ENV
          else echo "RODAR_R=sim" >> $GITHUB_ENV; fi
          echo "versão $novo (antes: $antigo)"

      - name: Liberar espaço em disco
        if: env.RODAR_R == 'sim'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: r-lib/actions/setup-r@v2
        if: env.RODAR_R == 'sim'
        with:
          use-public-rspm: true

      - name: Cache dos pacotes R
        if: env.RODAR_R == 'sim'
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-${{ runner.os }}-painel-v1

      - name: Pacotes R
        if: env.RODAR_R == 'sim'
        run: Rscript -e 'for (p in c("data.table", "zip", "jsonlite")) if (!requireNamespace(p, quietly = TRUE)) install.packages(p)'

      - name: Baixar dados do TSE (01_baixar_dados.R)
        if: env.RODAR_R == 'sim'
        working-directory: scripts
        run: |
          mkdir -p resultados
          Rscript 01_baixar_dados.R 2>&1 | tail -30
          exit ${PIPESTATUS[0]}

      - name: Rodar 15_painel_candidatos.R
        if: env.RODAR_R == 'sim'
        working-directory: scripts
        run: |
          Rscript 15_painel_candidatos.R 2>&1 | tee resultados/log_15_painel_candidatos.txt
          exit ${PIPESTATUS[0]}

      - name: Gravar no branch painel-dados
        working-directory: painel/dados
        run: |
          cp ../index.html index.html 2>/dev/null || true
          if [ "$RODAR_R" = "sim" ]; then cp ../../scripts/resultados/log_15_painel_candidatos.txt .; echo "$VERSAO_15" > .versao_15; fi
          touch .nojekyll
          du -sh .
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -q -m "Painel: votos de todos os candidatos e index.html (${GITHUB_SHA::7})" || echo "nada mudou"
          git push -q origin HEAD:painel-dados
