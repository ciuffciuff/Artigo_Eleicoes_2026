name: Sondagem das fontes (TSE e IBGE)

# Verifica, em poucos minutos, se os servidores do TSE e do IBGE respondem ao
# GitHub Actions e mostra as colunas dos arquivos usados no script 13.
on:
  workflow_dispatch:
  push:
    branches: [ibge-actions]
    paths: [".github/workflows/sondagem_fontes.yml"]

jobs:
  sondagem:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: IBGE - listas de arquivos e dicionário
        run: |
          B=https://ftp.ibge.gov.br/Censos/Censo_Demografico_2022
          M=https://geoftp.ibge.gov.br/organizacao_do_territorio/malhas_territoriais/malhas_de_setores_censitarios__divisoes_intramunicipais/censo_2022
          lista() { echo "---- $1"; curl -s -m 60 "$1" | grep -oE 'href="[^"?][^"]*"[^<]*</a></td><td[^>]*>[^<]*</td><td[^>]*>[^<]*' | sed 's/<[^>]*>/ /g' | head -80; }
          lista $B/Agregados_por_Setores_Censitarios/Agregados_por_Setor_csv/
          lista $B/Agregados_por_Setores_Censitarios/malha_com_atributos/
          lista $B/Agregados_por_Setores_Censitarios_Rendimento_do_Responsavel/
          lista $B/Favelas_e_comunidades_urbanas_Resultados_do_universo/
          lista $M/setores/
          lista $M/setores/gpkg/ || true
          pip install -q openpyxl
          curl -sSL -o dic.xlsx $B/Agregados_por_Setores_Censitarios/dicionario_de_dados_agregados_por_setores_censitarios_20260520.xlsx
          python3 - <<'PY'
          import openpyxl
          wb = openpyxl.load_workbook("dic.xlsx", read_only=True)
          print("ABAS:", wb.sheetnames)
          for ws in wb.worksheets:
              rows = list(ws.iter_rows(values_only=True))
              print("=== ABA", ws.title, len(rows))
              for r in rows[:4]: print(r)
              for r in rows:
                  t = " | ".join(str(x) for x in r if x is not None)
                  if any(k in t for k in ["V0001", "V0002", "V0003", "V0004", "V0005", "V0006", "V0007", "V01317", "V01318", "V01319", "V01320", "V01321", "V00644", "V00748", "lfabetiz", "Rendimento", "rendimento", "esgot", "Arquivo", "arquivo"]):
                      print(t[:300])
          PY
