name: N15 - Enriquecimento com o Censo 2022 (IBGE)

# Roda scripts/13_enriquecimento_ibge.R numa máquina do GitHub (4 núcleos,
# 16 GB de RAM). Baixa tudo do TSE e do IBGE; os resultados (N15_*.csv e o
# log) ficam para download na página da execução, em "Artifacts".
#
# Para rodar: aba Actions > "N15 - Enriquecimento..." > Run workflow.
#   modo = teste     -> só AC, RR e SE (uns 15 minutos)
#   modo = completo  -> Brasil inteiro (1 a 3 horas)
# Num push para o branch ibge-actions, o modo vem de .github/n15_modo.txt.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "teste (AC, RR, SE) ou completo (Brasil)"
        required: true
        default: teste
        type: choice
        options: [teste, completo]
  push:
    branches: [ibge-actions]
    paths: ["scripts/13_enriquecimento_ibge.R", "scripts/14_painel_dados.R", ".github/workflows/n15_censo_ibge.yml", ".github/n15_modo.txt"]

jobs:
  n15:
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # para gravar os dados do painel no branch painel-dados
    timeout-minutes: 340
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      # modo: escolhido no botão "Run workflow"; num push, lido de .github/n15_modo.txt
      - name: Modo (teste ou completo)
        run: |
          modo="${{ inputs.modo }}"
          [ -z "$modo" ] && modo=$(tr -d '[:space:]' < .github/n15_modo.txt 2>/dev/null || echo teste)
          if [ "$modo" = "completo" ]; then echo "UFS_TESTE=" >> $GITHUB_ENV; echo "ROTULO=completo" >> $GITHUB_ENV
          else echo "UFS_TESTE=AC,RR,SE" >> $GITHUB_ENV; echo "ROTULO=teste" >> $GITHUB_ENV; fi
          echo "modo: $modo"

      - name: Liberar espaço em disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Bibliotecas do sistema (GDAL, GEOS, PROJ)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgdal-dev libgeos-dev libproj-dev libudunits2-dev

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Cache dos pacotes R
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-${{ runner.os }}-n15-v1

      - name: Pacotes R
        run: Rscript -e 'for (p in c("data.table", "zip", "sf", "bit64")) if (!requireNamespace(p, quietly = TRUE)) install.packages(p); library(sf)'

      - name: Rodar 13_enriquecimento_ibge.R
        working-directory: scripts
        run: |
          echo "UFS_TESTE='$UFS_TESTE'"
          mkdir -p resultados
          Rscript 13_enriquecimento_ibge.R 2>&1 | tee resultados/log_13_enriquecimento_ibge.txt
          exit ${PIPESTATUS[0]}

      - name: Dados do painel (14_painel_dados.R)
        working-directory: scripts
        run: |
          Rscript -e 'if (!requireNamespace("jsonlite", quietly = TRUE)) install.packages("jsonlite")'
          Rscript 14_painel_dados.R 2>&1 | tee resultados/log_14_painel_dados.txt
          exit ${PIPESTATUS[0]}

      - name: Gravar dados do painel no branch painel-dados
        run: |
          cp scripts/resultados/N15_*.csv scripts/resultados/log_1[34]_*.txt painel/dados/ 2>/dev/null || true
          cd painel/dados && ls -la && du -sh .
          git init -q -b painel-dados && git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Dados do painel ($ROTULO, ${GITHUB_SHA::7})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" painel-dados

      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: N15_resultados_${{ env.ROTULO }}
          path: |
            scripts/resultados/N15_*.csv
            scripts/resultados/log_1*.txt
